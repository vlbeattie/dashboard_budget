<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Dashboard — Spending by Category</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <nav class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-2">
      <span class="font-semibold text-lg mr-4">Budget Dashboard</span>
      <a href="index.html" class="px-3 py-2 rounded-md text-sm font-medium bg-slate-900 text-white">
        Spending by Category
      </a>
      <!-- Future pages (e.g. Trends, Transactions) can be added here. -->
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">
    <div>
      <h1 class="text-2xl font-bold">Spending by Category</h1>
      <p class="text-slate-600 mt-1">
        See how your spending breaks down by category over a chosen date range.
      </p>
    </div>

    <div id="chart-error" class="hidden bg-red-50 text-red-700 border border-red-200 rounded-md px-4 py-3 text-sm"></div>

    <section class="bg-white rounded-lg border border-slate-200 p-4 space-y-3">
      <div class="flex flex-wrap gap-2">
        <button type="button" class="preset-btn px-3 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-colors" data-preset="this-month">This Month</button>
        <button type="button" class="preset-btn px-3 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-colors" data-preset="last-month">Last Month</button>
        <button type="button" class="preset-btn px-3 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-colors" data-preset="last-3-months">Last 3 Months</button>
        <button type="button" class="preset-btn px-3 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 transition-colors" data-preset="all">All Time</button>
      </div>
      <div class="flex flex-wrap items-end gap-4 pt-2 border-t border-slate-100">
        <label class="flex flex-col text-sm text-slate-600">
          Start date
          <input type="date" id="start-date" class="mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </label>
        <label class="flex flex-col text-sm text-slate-600">
          End date
          <input type="date" id="end-date" class="mt-1 border border-slate-300 rounded-md px-2 py-1.5 text-sm" />
        </label>
      </div>
    </section>

    <section class="bg-white rounded-lg border border-slate-200 p-6">
      <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
        <div class="chart-container">
          <canvas id="category-pie-chart"></canvas>
        </div>
        <div class="w-full md:w-72 shrink-0">
          <div class="mb-4">
            <div class="text-sm text-slate-500">Total spend</div>
            <div id="total-spend" class="text-2xl font-bold">$0.00</div>
            <div id="total-count" class="text-sm text-slate-500">0 transactions</div>
          </div>
          <ul id="category-legend" class="divide-y divide-slate-100"></ul>
        </div>
      </div>

      <div id="other-breakdown-section" class="hidden mt-6 pt-4 border-t border-slate-200">
        <h2 class="text-sm font-semibold text-slate-700 mb-2">
          "Other" breakdown (categories under 2% of total each)
        </h2>
        <ul id="other-breakdown-list" class="divide-y divide-slate-100 max-w-md"></ul>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/pages/spending-by-category.js"></script>
</body>
</html>
